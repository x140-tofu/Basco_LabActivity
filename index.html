<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="app-title" contenteditable="true" title="Click to edit title">Task Manager (CRUD Lab)</h1>

        <div id="status-message" class="hidden"></div>

        <form id="task-form">
            <input type="hidden" id="task-id">
            <div class="form-group">
                <input type="text" id="task-title" placeholder="Enter a new task..." required>
                <select id="task-category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="School">School</option>
                    <option value="Urgent">Urgent</option>
                </select>
                <input type="date" id="task-date" required>
                <button type="submit" id="submit-btn">Add Task</button>
            </div>
        </form>

        <div id="loading-spinner" class="hidden">Processing asynchronous request...</div>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
